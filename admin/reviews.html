<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathe Achi | Reviews Management</title>
  <link rel="icon" href="../logo.png" type="image/png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="admin-style.css?v=4">
  <style>
    .filters-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-select { padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-color); color: var(--text-dark); outline: none; min-height: var(--touch-min); flex: 1; min-width: 140px; font-family: 'Inter'; font-size: 14px; }
    
    .rating-stars { color: #FFD700; font-size: 13px; display: inline-flex; gap: 2px; }
    .review-text-cell { max-width: 260px; white-space: normal !important; line-height: 1.4; font-size: 13px; color: var(--text-muted); }

    .action-btn { background: none; border: none; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: var(--trans); font-size: 12px; font-weight: 600; min-height: 36px; display: inline-flex; align-items: center; gap: 4px; }
    .btn-approve { color: var(--success); background: rgba(52,199,89,0.1); }
    .btn-approve:hover { background: var(--success); color: #fff; }
    .btn-reject { color: var(--warning); background: rgba(255,149,0,0.1); margin-left: 4px; }
    .btn-reject:hover { background: var(--warning); color: #fff; }
    .btn-del { color: var(--danger); font-size: 14px; margin-left: 4px; background: rgba(255,59,48,0.1); }
    .btn-del:hover { background: var(--danger); color: #fff; }

    /* Mobile review cards */
    .rev-card { background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-xs); }
    .rev-card-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .rev-card-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: 800; font-size: 16px; flex-shrink: 0; }
    .rev-card-info { flex: 1; min-width: 0; }
    .rev-card-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rev-card-product { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rev-card-rating { display: flex; gap: 2px; margin-top: 4px; }
    .rev-card-status { flex-shrink: 0; }
    .rev-card-text { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px; font-style: italic; background: var(--bg-color); padding: 12px; border-radius: var(--radius-sm); border-left: 3px solid var(--border); }
    .rev-card-footer { display: flex; gap: 8px; align-items: center; }
    .rev-card-date { font-size: 11px; color: var(--text-muted); margin-left: auto; }
  </style>
</head>
<body>

<div class="admin-layout">
  <div class="sa-sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR -->
  <aside class="sa-sidebar" id="adminSidebar">
    <div class="sa-sidebar-header">
      <a href="index.html" class="sa-sidebar-logo"><i class="fa-solid fa-bag-shopping"></i> SatheAchi</a>
      <button class="sa-sidebar-close" id="sidebarCloseBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <nav class="sa-sidebar-nav">
      <a href="index.html" class="sa-nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
      <a href="products.html" class="sa-nav-item"><i class="fa-solid fa-box"></i> Products</a>
      <a href="categories.html" class="sa-nav-item"><i class="fa-solid fa-tags"></i> Categories</a>
      <a href="orders.html" class="sa-nav-item"><i class="fa-solid fa-cart-shopping"></i> Orders</a>
      <a href="customers.html" class="sa-nav-item"><i class="fa-solid fa-users"></i> Customers</a>
      <a href="banners.html" class="sa-nav-item"><i class="fa-regular fa-image"></i> Banners</a>
      <a href="coupons.html" class="sa-nav-item"><i class="fa-solid fa-ticket"></i> Coupons</a>
      <a href="reviews.html" class="sa-nav-item active"><i class="fa-regular fa-star"></i> Reviews</a>
      <div style="flex:1"></div>
      <a href="settings.html" class="sa-nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
      <a href="#" class="sa-nav-item" onclick="event.preventDefault(); adminLogout();"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="sa-main">
    <header class="sa-topbar">
      <div class="sa-tb-left">
        <button class="sa-menu-btn" id="mobileMenuBtn"><i class="fa-solid fa-bars"></i></button>
        <h1 class="sa-tb-title">Reviews</h1>
      </div>
      <div class="sa-tb-right">
        <button class="sa-icon-btn" id="adminThemeBtn"><i class="fa-regular fa-moon"></i></button>
        <div class="sa-admin-profile">
          <div class="sa-admin-avatar"><i class="fa-solid fa-user-tie"></i></div>
          <div class="sa-admin-info"><span class="sa-admin-name" id="topbarAdminName">Admin</span><span class="sa-admin-role">Super Admin</span></div>
        </div>
      </div>
    </header>

    <div class="sa-page-content">
      <div class="sa-table-card">
        <div class="sa-card-header">
          <h3 class="sa-card-title">Manage Customer Reviews</h3>
        </div>
        
        <div class="filters-bar" style="margin-top:16px;">
          <select id="filterStatus" class="filter-select" onchange="filterTable()">
            <option value="all">All Reviews</option>
            <option value="pending" selected>Pending Approval</option>
            <option value="approved">Approved</option>
          </select>
          <select id="filterRating" class="filter-select" onchange="filterTable()">
            <option value="all">All Ratings</option>
            <option value="5">5 Stars</option>
            <option value="4">4 Stars</option>
            <option value="3">3 Stars</option>
            <option value="2">2 Stars</option>
            <option value="1">1 Star</option>
          </select>
        </div>
        
        <!-- Desktop Table -->
        <div class="sa-table-resp-wrap">
          <table class="sa-table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Product</th>
                <th>Rating</th>
                <th>Review Text</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="reviewTableBody">
              <tr><td colspan="7"><div class="sa-skeleton" style="height:40px;"></div></td></tr>
            </tbody>
          </table>
        </div>

        <!-- Mobile Cards -->
        <div class="sa-mobile-cards" id="reviewMobileCards">
          <div class="sa-skeleton" style="height:160px; border-radius:var(--radius-md);"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="admin-app.js"></script>
<script>
  let reviews = [];

  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
    document.getElementById('adminSidebar').classList.add('show');
    document.getElementById('sidebarOverlay').classList.add('show');
  });
  document.getElementById('sidebarOverlay').addEventListener('click', () => {
    document.getElementById('adminSidebar').classList.remove('show');
    document.getElementById('sidebarOverlay').classList.remove('show');
  });

  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(loadReviews, 500);
  });

  async function loadReviews() {
    try {
      const { data, error } = await window.db.from('reviews')
        .select(`*, profiles(full_name), products(name)`)
        .order('created_at', { ascending: false });
        
      if (error) throw error;
      reviews = data || [];
      filterTable();
    } catch (err) {
      console.error(err);
      showToast('Error loading reviews', 'error');
    }
  }

  function filterTable() {
    const status = document.getElementById('filterStatus').value;
    const rating = document.getElementById('filterRating').value;
    const filtered = reviews.filter(r => {
      let matchStatus = true;
      if (status === 'pending') matchStatus = r.is_approved === false;
      if (status === 'approved') matchStatus = r.is_approved === true;
      const matchRating = rating === 'all' || r.rating === parseInt(rating);
      return matchStatus && matchRating;
    });
    renderTable(filtered);
    renderMobileCards(filtered);
  }

  function getStars(rating) {
    let html = '';
    for (let i = 0; i < 5; i++) {
      html += i < rating ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star"></i>';
    }
    return html;
  }

  function renderTable(data) {
    const tbody = document.getElementById('reviewTableBody');
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px; color:var(--text-muted);">No reviews found.</td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(r => {
      const userName = r.profiles ? r.profiles.full_name : 'Unknown User';
      const prodName = r.products ? r.products.name : 'Unknown Product';
      const statusHtml = r.is_approved 
        ? `<span class="sa-status-badge status-delivered">Approved</span>`
        : `<span class="sa-status-badge status-pending">Pending</span>`;
      return `
        <tr>
          <td style="font-weight:600">${userName}</td>
          <td>${prodName}</td>
          <td><div class="rating-stars">${getStars(r.rating)}</div></td>
          <td class="review-text-cell">"${r.review_text || ''}"</td>
          <td>${new Date(r.created_at).toLocaleDateString()}</td>
          <td>${statusHtml}</td>
          <td>
            ${!r.is_approved 
              ? `<button class="action-btn btn-approve" onclick="toggleApproval('${r.id}', true)"><i class="fa-solid fa-check"></i> Approve</button>` 
              : `<button class="action-btn btn-reject" onclick="toggleApproval('${r.id}', false)"><i class="fa-solid fa-xmark"></i> Revoke</button>`}
            <button class="action-btn btn-del" onclick="deleteReview('${r.id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function renderMobileCards(data) {
    const container = document.getElementById('reviewMobileCards');
    if (data.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:48px 20px; color:var(--text-muted);"><i class="fa-regular fa-star" style="font-size:40px; margin-bottom:12px; display:block;"></i><p>No reviews found.</p></div>`;
      return;
    }
    container.innerHTML = data.map(r => {
      const userName = r.profiles ? r.profiles.full_name : 'Unknown';
      const prodName = r.products ? r.products.name : 'Unknown Product';
      const initial = userName.charAt(0).toUpperCase();
      const statusBadge = r.is_approved 
        ? `<span class="sa-status-badge status-delivered">Approved</span>`
        : `<span class="sa-status-badge status-pending">Pending</span>`;
      return `
        <div class="rev-card">
          <div class="rev-card-top">
            <div class="rev-card-avatar">${initial}</div>
            <div class="rev-card-info">
              <div class="rev-card-name">${userName}</div>
              <div class="rev-card-product"><i class="fa-solid fa-box" style="font-size:10px; margin-right:4px;"></i>${prodName}</div>
              <div class="rev-card-rating rating-stars">${getStars(r.rating)}</div>
            </div>
            <div class="rev-card-status">${statusBadge}</div>
          </div>
          ${r.review_text ? `<div class="rev-card-text">${r.review_text}</div>` : ''}
          <div class="rev-card-footer">
            ${!r.is_approved 
              ? `<button class="action-btn btn-approve" onclick="toggleApproval('${r.id}', true)" style="flex:1; justify-content:center;"><i class="fa-solid fa-check"></i> Approve</button>` 
              : `<button class="action-btn btn-reject" onclick="toggleApproval('${r.id}', false)" style="flex:1; justify-content:center;"><i class="fa-solid fa-xmark"></i> Revoke</button>`}
            <button class="action-btn btn-del" onclick="deleteReview('${r.id}')"><i class="fa-solid fa-trash"></i></button>
            <span class="rev-card-date">${new Date(r.created_at).toLocaleDateString()}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  async function toggleApproval(id, is_approved) {
    try {
      const { error } = await window.db.from('reviews').update({ is_approved }).eq('id', id);
      if (error) throw error;
      showToast(is_approved ? 'Review Approved' : 'Approval Revoked', 'success');
      loadReviews();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function deleteReview(id) {
    saConfirm('Are you sure you want to delete this review permanently?', async () => {
      try {
        const { error } = await window.db.from('reviews').delete().eq('id', id);
        if (error) throw error;
        showToast('Review deleted', 'success');
        loadReviews();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  }
</script>
</body>
</html>
