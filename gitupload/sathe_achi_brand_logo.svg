  <defs>
    <!-- Hollow 4-point star -->
    <path id="star-hollow" d="M0,-13 Q0,0 13,0 Q0,0 0,13 Q0,0 -13,0 Q0,0 0,-13 Z" />
    <!-- Mini sparkle -->
    <path id="sparkle-mini" d="M0,-7 Q0,0 7,0 Q0,0 0,7 Q0,0 -7,0 Q0,0 0,-7 Z" />
    <!-- Delicate sparkle -->
    <path id="sparkle-delicate" d="M0,-5 Q0,0 5,0 Q0,0 0,5 Q0,0 -5,0 Q0,0 0,-5 Z" />
  </defs>

  <!-- ═══ LEFT CELESTIAL EMBLEM (Compass North Star + Ring + Moon + Dots) ═══ -->
  <g transform="translate(36, 38)">
    <!-- Delicate Gold Orbital Ring -->
    <circle cx="0" cy="0" r="18.5" fill="none" stroke="#cca24a" stroke-width="1.3" opacity="0.88" />
    
    <!-- Rotated Gold accent star (45 deg) -->
    <path d="M0,-23 Q0,0 21,0 Q0,0 0,23 Q0,0 -21,0 Q0,0 0,-23 Z" fill="#cca24a" opacity="0.75" transform="rotate(45) scale(0.65)" />
    
    <!-- Elongated North Star (Compass Star) -->
    <path d="M0,-28 Q0,0 20,0 Q0,0 0,28 Q0,0 -20,0 Q0,0 0,-28 Z" fill="#0a1c38" />
    
    <!-- Inner bright center core -->
    <circle cx="0" cy="0" r="2.2" fill="#e8c978" />
    
    <!-- Gold Crescent Moon at bottom-left -->
    <path d="M-13,16 A5,5 0 1,0 -7,22 A6,6 0 0,1 -13,16 Z" fill="#cca24a" />
    <!-- Celestial gold dot at top-left -->
    <circle cx="14" cy="-16" r="2.3" fill="#cca24a" />
    <!-- Celestial gold dot at bottom-center (under S) -->
    <circle cx="31" cy="22" r="2.2" fill="#cca24a" />
  </g>

