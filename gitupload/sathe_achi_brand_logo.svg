  <!-- ═══ CENTER CELESTIAL ACCENTS (between SATHE and ACHI) ═══ -->
  <!-- Top Hollow Gold Star -->
  <g transform="translate(222.1, 16)">
    <use href="#star-hollow" fill="none" stroke="#cca24a" stroke-width="1.4" />
    <circle cx="0" cy="0" r="1.2" fill="#cca24a" />
  </g>
  <!-- Bottom Solid Sparkle -->
  <g transform="translate(222.1, 58)">
    <use href="#sparkle-mini" fill="#0a1c38" />
  </g>

  <!-- ═══ UPPER ACCENTS OVER 'ACHI' ═══ -->
  <!-- Navy Dot over H/I -->
  <circle cx="311.4" cy="15" r="2.6" fill="#0a1c38" />
  <!-- Gold Sparkle over I -->
  <g transform="translate(340.4, 15)">
    <use href="#sparkle-mini" fill="#cca24a" transform="scale(1.15)" />
  </g>

  <!-- ═══ RIGHT CELESTIAL EMBLEM ═══ -->
  <g transform="translate(379.4, 38)">
    <!-- Gold drop-shadow star offset -->
    <g transform="translate(3.5, 3.5)">
      <path d="M0,-19 Q0,0 18,0 Q0,0 0,19 Q0,0 -18,0 Q0,0 0,-19 Z" fill="#cca24a" />
    </g>
    <!-- Navy star on top -->
    <path d="M0,-19 Q0,0 18,0 Q0,0 0,19 Q0,0 -18,0 Q0,0 0,-19 Z" fill="#0a1c38" />
    <!-- Bright center glint -->
    <circle cx="0" cy="0" r="1.8" fill="#e8c978" />
    
    <!-- Top Gold Sparkle above right star -->
    <g transform="translate(-8, -22)">
      <use href="#sparkle-mini" fill="#cca24a" transform="scale(0.9)" />
    </g>
    <!-- Bottom Gold Sparkle directly below right star -->
    <g transform="translate(0, 24)">
      <use href="#sparkle-mini" fill="#cca24a" transform="scale(0.95)" />
    </g>
  </g>
</svg>