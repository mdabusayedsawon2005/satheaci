<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sathe Achi | Admin Login</title>
  <link rel="icon" href="../logo.png" type="image/png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="admin-style.css?v=3">

  <style>
    .login-container {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg-color); padding: 20px;
    }
    .login-box {
      width: 100%; max-width: 400px; background: var(--surface); padding: 40px;
      border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
      border: 1px solid var(--glass-border); text-align: center;
    }
    .login-logo { font-size: 28px; font-weight: 900; color: var(--text-dark); margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .login-logo i { color: var(--primary); }
    .login-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; }
    
    .form-group { text-align: left; margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input { width: 100%; padding: 14px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-color); color: var(--text-dark); font-size: 15px; outline: none; transition: var(--trans); }
    .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
    
    .login-btn { width: 100%; padding: 16px; border-radius: var(--radius-sm); background: var(--primary); color: #fff; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: var(--trans); }
    .login-btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,107,0,0.3); }
    .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <div class="login-logo"><i class="fa-solid fa-bag-shopping"></i> SatheAchi</div>
    <div class="login-desc">Secure Admin Portal Login</div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-input" required autocomplete="email" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" id="loginBtn" class="login-btn">Sign In to Dashboard</button>
    </form>
  </div>
</div>

<script src="admin-app.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

    // ── SUPER ADMIN DIRECT CREDENTIALS ──
    const allowedAdminEmails = ['11@gmail.com', 'mdabusayedsawon2005@gmail.com'];
    const superAdminPassword = 'abusayed2025';

    if (allowedAdminEmails.includes(email.toLowerCase()) && password === superAdminPassword) {
      localStorage.setItem('sa_admin_auth', 'true');
      localStorage.setItem('sa_admin_email', email.toLowerCase());
      localStorage.setItem('sa_admin_name', 'Abu Sayed');
      localStorage.setItem('sa_admin_role', 'Super Admin');

      // Attempt Supabase sign in in background
      try {
        await window.db.auth.signInWithPassword({ email, password });
      } catch (e) {
        // Background sync optional
      }

      window.showToast('Login successful! Welcome Abu Sayed.', 'success');
      setTimeout(() => window.location.href = 'index.html', 800);
      return;
    }

    try {
      // Step 1: Sign in with Supabase to get a real JWT session
      const { data: authData, error: authError } = await window.db.auth.signInWithPassword({ email, password });
      if (authError) throw authError;

      // Step 2: Verify the user is in the admins table
      const { data: adminRow, error: adminError } = await window.db
        .from('admins')
        .select('role')
        .eq('user_id', authData.user.id)
        .single();

      if (adminError || !adminRow) {
        // Not an admin — sign them out immediately
        await window.db.auth.signOut();
        throw new Error('Access denied. You are not authorized as an admin.');
      }

      // Step 3: Store admin credentials
      localStorage.setItem('sa_admin_auth', 'true');
      localStorage.setItem('sa_admin_email', email);
      localStorage.setItem('sa_admin_role', adminRow.role || 'Admin');

      window.showToast('Login successful!', 'success');
      setTimeout(() => window.location.href = 'index.html', 1000);

    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = 'Sign In to Dashboard';
      const msg = err.message || 'Login failed. Please check your credentials.';
      window.saGlassModal.show({
        type: 'error',
        title: 'Login Failed',
        message: msg,
        confirmText: 'Try Again'
      });
    }
  });
</script>
</body>
</html>
