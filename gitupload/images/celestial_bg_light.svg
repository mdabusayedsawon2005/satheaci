<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <defs>
    <!-- Royal 4-point star path (from brand logo) -->
    <path id="star-royal" d="M0,-16 Q0,0 16,0 Q0,0 0,16 Q0,0 -16,0 Q0,0 0,-16 Z" />
    <!-- Mini sparkle -->
    <path id="sparkle" d="M0,-8 Q0,0 8,0 Q0,0 0,8 Q0,0 -8,0 Q0,0 0,-8 Z" />
    <!-- Micro sparkle -->
    <path id="micro-sparkle" d="M0,-5 Q0,0 5,0 Q0,0 0,5 Q0,0 -5,0 Q0,0 0,-5 Z" />
    <!-- 8-point star -->
    <g id="star-8pt">
      <path d="M0,-10 Q0,0 10,0 Q0,0 0,10 Q0,0 -10,0 Q0,0 0,-10 Z" />
      <path d="M0,-6 Q0,0 6,0 Q0,0 0,6 Q0,0 -6,0 Q0,0 0,-6 Z" transform="rotate(45)" />
    </g>
  </defs>

  <g fill="#c59b27" stroke="#c59b27" opacity="0.055">
    <!-- ═══ CENTER MAJOR MOTIF: Compass Star + Ring ═══ -->
    <g transform="translate(140, 140)">
      <circle cx="0" cy="0" r="22" fill="none" stroke-width="0.8" stroke-dasharray="2 3" />
      <circle cx="0" cy="0" r="32" fill="none" stroke-width="0.5" />
      <use href="#star-royal" stroke="none" />
      <circle cx="0" cy="0" r="2.5" fill="#fff" stroke="none" />
      <!-- Orbital dots -->
      <circle cx="22" cy="0" r="1.4" stroke="none" />
      <circle cx="-22" cy="0" r="1.4" stroke="none" />
      <circle cx="0" cy="22" r="1.4" stroke="none" />
      <circle cx="0" cy="-22" r="1.4" stroke="none" />
    </g>

    <!-- ═══ 4 CORNERS (Seamless Repeat) ═══ -->
    <g transform="translate(0, 0)"><use href="#star-8pt" stroke="none" /><circle cx="0" cy="0" r="14" fill="none" stroke-width="0.7" /></g>
    <g transform="translate(280, 0)"><use href="#star-8pt" stroke="none" /><circle cx="0" cy="0" r="14" fill="none" stroke-width="0.7" /></g>
    <g transform="translate(0, 280)"><use href="#star-8pt" stroke="none" /><circle cx="0" cy="0" r="14" fill="none" stroke-width="0.7" /></g>
    <g transform="translate(280, 280)"><use href="#star-8pt" stroke="none" /><circle cx="0" cy="0" r="14" fill="none" stroke-width="0.7" /></g>

    <!-- ═══ CONSTELLATION MAPPING LINES ═══ -->
    <g fill="none" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.6">
      <line x1="60" y1="65" x2="140" y2="140" />
      <line x1="140" y1="140" x2="220" y2="75" />
      <line x1="140" y1="140" x2="70" y2="215" />
      <line x1="140" y1="140" x2="215" y2="220" />
    </g>

    <!-- ═══ QUADRANT 1: Top-Left (Moon & Starlight) ═══ -->
    <g transform="translate(60, 65)">
      <use href="#sparkle" stroke="none" />
      <!-- Subtle crescent moon -->
      <path d="M-12,8 A7,7 0 1,0 -4,15 A8.5,8.5 0 0,1 -12,8 Z" stroke="none" />
      <circle cx="12" cy="-10" r="1.5" stroke="none" />
    </g>

    <!-- ═══ QUADRANT 2: Top-Right (Diamond Burst) ═══ -->
    <g transform="translate(220, 75)">
      <use href="#star-royal" stroke="none" transform="scale(0.65)" />
      <circle cx="0" cy="0" r="15" fill="none" stroke-width="0.6" />
      <circle cx="-18" cy="-8" r="1.2" stroke="none" />
      <circle cx="16" cy="14" r="1.2" stroke="none" />
    </g>

    <!-- ═══ QUADRANT 3: Bottom-Left (Star Cluster) ═══ -->
    <g transform="translate(70, 215)">
      <use href="#star-royal" stroke="none" transform="scale(0.7)" />
      <circle cx="0" cy="0" r="16" fill="none" stroke-width="0.5" stroke-dasharray="2 2" />
      <circle cx="14" cy="-12" r="1.3" stroke="none" />
      <circle cx="-12" cy="14" r="1.2" stroke="none" />
    </g>

    <!-- ═══ QUADRANT 4: Bottom-Right (Delicate Sparkle) ═══ -->
    <g transform="translate(215, 220)">
      <use href="#sparkle" stroke="none" />
      <circle cx="0" cy="0" r="11" fill="none" stroke-width="0.7" />
      <circle cx="-14" cy="10" r="1.4" stroke="none" />
    </g>

    <!-- ═══ SCATTERED MICRO STARDUST (Fixed Cosmic Field) ═══ -->
    <circle cx="35" cy="135" r="1.5" stroke="none" />
    <circle cx="245" cy="145" r="1.5" stroke="none" />
    <circle cx="140" cy="35" r="1.6" stroke="none" />
    <circle cx="140" cy="245" r="1.6" stroke="none" />

    <g transform="translate(105, 35)"><use href="#micro-sparkle" stroke="none" /></g>
    <g transform="translate(175, 245)"><use href="#micro-sparkle" stroke="none" /></g>
    <g transform="translate(35, 175)"><use href="#micro-sparkle" stroke="none" /></g>
    <g transform="translate(245, 105)"><use href="#micro-sparkle" stroke="none" /></g>

    <circle cx="100" cy="110" r="1" stroke="none" />
    <circle cx="180" cy="115" r="1" stroke="none" />
    <circle cx="110" cy="175" r="1" stroke="none" />
    <circle cx="170" cy="170" r="1" stroke="none" />
  </g>
</svg>
