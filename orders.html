<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){try{if(localStorage.getItem('sathe_achi_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.removeAttribute('data-theme');}}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Sathe Achi</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="sa-style.css?v=31">
  <style>
    body { background: #f4f6f8; }
    
    .pg-title-bar { background: var(--navy); padding: 16px 0; }
    .pg-title-bar h1 { color: #fff; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    
    .ord-container { display: grid; grid-template-columns: 1fr; gap: 20px; margin: 30px 0 80px; }
    @media(min-width: 992px) { .ord-container { grid-template-columns: 1.2fr 1.8fr; align-items: start; } }

    /* ─── ORDERS LIST ─── */
    .ord-list-card { background: var(--white); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .ord-list-title { font-size: 16px; font-weight: 800; margin-bottom: 20px; color: var(--text-dark); }
    
    .ord-item { border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; cursor: pointer; transition: var(--trans); background: #fff; }
    .ord-item:hover { border-color: var(--primary); background: var(--primary-light); }
    .ord-item.active { border-color: var(--primary); background: var(--primary-light); }
    
    .ord-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .ord-id { font-size: 14px; font-weight: 800; color: var(--text-dark); }
    .ord-status { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; }
    .status-pending { background: #fef3c7; color: #d97706; }
    .status-processing { background: #dbeafe; color: #2563eb; }
    .status-shipped { background: #e0e7ff; color: #4f46e5; }
    .status-delivered { background: #d1fae5; color: #059669; }
    .status-cancelled { background: #fee2e2; color: #dc2626; }
    
    .ord-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
    .ord-total { font-weight: 700; color: var(--primary); font-size: 14px; }

    /* ─── ORDER DETAILS (TIMELINE & ITEMS) ─── */
    .ord-details-card { background: var(--white); border-radius: var(--radius-lg); padding: 30px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: none; }
    @media(min-width: 992px) { .ord-details-card { display: block; position: sticky; top: 90px; } }
    
    .ord-det-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .ord-det-id { font-size: 20px; font-weight: 900; color: var(--text-dark); margin-bottom: 4px; }
    .ord-det-date { font-size: 13px; color: var(--text-muted); }
    
    /* Timeline */
    .timeline { position: relative; margin: 30px 0; padding-left: 20px; }
    .timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: #e5e7eb; }
    .tl-item { position: relative; padding-left: 20px; margin-bottom: 24px; }
    .tl-item:last-child { margin-bottom: 0; }
    .tl-dot { position: absolute; left: -21px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #e5e7eb; border: 3px solid #fff; z-index: 2; transition: var(--trans); }
    .tl-item.active .tl-dot { background: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .tl-item.done .tl-dot { background: #10b981; }
    .tl-item.done ~ .timeline::before { background: #10b981; } /* Just visual hack for mock */
    .tl-title { font-size: 14px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
    .tl-desc { font-size: 12px; color: var(--text-muted); }
    
    /* Details block */
    .info-block { background: #f9f9fb; border-radius: var(--radius-md); padding: 16px; margin-bottom: 24px; }
    .info-title { font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 10px; border-bottom: 1px dashed var(--border); padding-bottom: 8px; }
    .info-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .info-row span:first-child { color: var(--text-muted); }
    .info-row span:last-child { color: var(--text-dark); font-weight: 500; text-align: right; }
    
    /* Product List */
    .prod-list { margin-bottom: 20px; }
    .prod-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .prod-item-img { width: 50px; height: 50px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; }
    .prod-item-img img { width: 100%; height: 100%; object-fit: contain; }
    .prod-item-info { flex: 1; }
    .prod-title { font-size: 13px; font-weight: 600; color: var(--text-dark); }
    .prod-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .prod-price { font-size: 13px; font-weight: 700; color: var(--text-dark); }

    /* Mobile Modal Overlay */
    .mob-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 1000; align-items: flex-end; }
    .mob-modal.active { display: flex; }
    .mob-modal-content { background: var(--white); width: 100%; max-height: 80vh; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; overflow-y: auto; position: relative; animation: slideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1); box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.15); }
    .mob-close { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.05); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
    @keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
    @media(min-width: 992px) { .mob-modal { display: none !important; } }

    /* ─── DARK MODE OVERRIDES ─── */
    [data-theme="dark"] body { background: #0f172a; }
    [data-theme="dark"] .ord-list-card, [data-theme="dark"] .ord-details-card, [data-theme="dark"] .mob-modal-content { background: rgba(30, 41, 59, 0.45); border-color: rgba(255, 255, 255, 0.05); }
    [data-theme="dark"] .ord-item { background: rgba(0, 0, 0, 0.15); border-color: rgba(255, 255, 255, 0.05); }
    [data-theme="dark"] .ord-item.active { background: rgba(255, 107, 0, 0.08); border-color: var(--primary); }
    [data-theme="dark"] .ord-id, [data-theme="dark"] .ord-list-title, [data-theme="dark"] .ord-det-id, [data-theme="dark"] .tl-title, [data-theme="dark"] .info-title, [data-theme="dark"] .info-row span:last-child, [data-theme="dark"] .prod-title, [data-theme="dark"] .prod-price { color: #fff; }
    [data-theme="dark"] .info-block { background: rgba(0, 0, 0, 0.2); }
    [data-theme="dark"] .tl-dot { border-color: #1e293b; background: #334155; }
    [data-theme="dark"] .timeline::before { background: #334155; }
    [data-theme="dark"] .prod-item-img { background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.05); }
    [data-theme="dark"] .mob-close { background: rgba(255,255,255,0.1); color: #fff; }
  </style>
</head>

<script>
let orders = [];
let pmtNames = { 
  'cod': 'Cash on Delivery', 
  'bkash': 'bKash Wallet', 
  'nagad': 'Nagad Wallet',
  'rocket': 'Rocket Wallet'
};

const supabase = window.supabaseClient || (window.supabase && typeof window.supabase.createClient === 'function'
    ? window.supabase.createClient('https://biteosolyhaoxwnzxdxx.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpdGVvc29seWhhb3h3bnp4ZHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4OTA3OTcsImV4cCI6MjA5NzQ2Njc5N30.jHjbpWxqqH83dLhGZ4MwYfk1pbnlov5jvP2x9Z0-S2g')
    : window.supabase);

document.addEventListener('storeDataLoaded', loadOrders);

// Fallback: if storeDataLoaded already fired before our listener registered
document.addEventListener('DOMContentLoaded', () => {
  if (window.storeAlreadyLoaded) loadOrders();
});

async function loadOrders() {
  const client = window.supabaseClient || supabase;
  if (!client || !USER_STATE || !USER_STATE.profile) return;
  
  const urlParams = new URLSearchParams(window.location.search);
  const filterStatus = urlParams.get('status');
  const targetOrder = urlParams.get('order');

  // 1. Instant render from local cache (0ms - zero waiting)
  try {
    const cachedOrders = localStorage.getItem('sa_orders_cache_' + USER_STATE.profile.id);
    if (cachedOrders) {
      let parsed = JSON.parse(cachedOrders);
      if (filterStatus) {
        parsed = parsed.filter(o => o.order_status.toLowerCase() === filterStatus.toLowerCase());
      }
      orders = parsed;
      renderOrdersList(filterStatus, targetOrder);
    }
  } catch(e) {}

  try {
    // 2. Fetch fresh orders quietly in background
    try {
      const { data: pmts } = await client.from('payment_settings').select('id, name');
      if (pmts) {
        pmts.forEach(p => {
          pmtNames[p.id] = p.name || (p.id.charAt(0).toUpperCase() + p.id.slice(1));
        });
      }
    } catch (e) {
      console.warn("Failed to load custom payment method names:", e);
    }
    const { data, error } = await client
      .from('orders')
      .select('*, order_items(*)')
      .eq('user_id', USER_STATE.profile.id)
      .order('created_at', { ascending: false });
      
    if (error) throw error;
    const freshOrders = data || [];
    try {
      localStorage.setItem('sa_orders_cache_' + USER_STATE.profile.id, JSON.stringify(freshOrders));
    } catch(e) {}

    orders = freshOrders;
    if (filterStatus) {
      orders = orders.filter(o => o.order_status.toLowerCase() === filterStatus.toLowerCase());
    }
    
    renderOrdersList(filterStatus, targetOrder);
  } catch(err) {
    console.error('Error fetching orders:', err);
    if (!orders || orders.length === 0) {
      document.getElementById('ordersList').innerHTML = `<div style="text-align:center; padding:40px 0; color:red; font-weight:700;">Failed to load orders: ${err.message}</div>`;
    }
  }
}

function renderOrdersList(filterStatus, targetOrderNumber) {
  const container = document.getElementById('ordersList');
  if(orders.length === 0) {
    let msg = "No orders found.";
    if(filterStatus) {
      msg = `No ${filterStatus} orders found.`;
    }
    container.innerHTML = `<div style="text-align:center; padding:40px 0; color:var(--text-muted);"><i class="fa-solid fa-box-open" style="font-size:40px; margin-bottom:10px; opacity:0.3;"></i><br>${msg}</div>`;
    
    if(window.innerWidth >= 992) {
      document.getElementById('desktopDetails').innerHTML = `
        <div style="text-align:center; padding: 60px 0; color:var(--text-muted);">
          <i class="fa-solid fa-folder-open" style="font-size:30px; margin-bottom:10px;"></i>
          <p>${msg}</p>
        </div>`;
    }
    return;
  }

  const html = orders.map((o, idx) => {
    let statusClass = 'status-pending';
    if (o.order_status === 'confirmed') statusClass = 'status-confirmed';
    if (o.order_status === 'processing') statusClass = 'status-processing';
    if (o.order_status === 'shipped') statusClass = 'status-shipped';
    if (o.order_status === 'delivered') statusClass = 'status-delivered';
    if (o.order_status === 'cancelled') statusClass = 'status-cancelled';

    return `
      <div class="ord-item" id="ord_item_${o.id}" onclick="viewOrder('${o.id}')">
        <div class="ord-item-head">
          <div class="ord-id">${o.order_number}</div>
          <div class="ord-status ${statusClass}" style="text-transform: capitalize;">${o.order_status}</div>
        </div>
        <div class="ord-meta">
          <div>${new Date(o.created_at).toLocaleDateString()} &bull; ${o.order_items.length} Items</div>
          <div class="ord-total">৳${Number(o.total).toLocaleString()}</div>
        </div>
      </div>
    `;
  }).join('');
  
  container.innerHTML = html;
  
  // Auto-select specific order if ?order= param is present
  if (targetOrderNumber) {
    const targetO = orders.find(o => o.order_number === decodeURIComponent(targetOrderNumber));
    if (targetO) {
      viewOrder(targetO.id);
      return;
    }
  }
  
  if(window.innerWidth >= 992 && orders.length > 0) {
    viewOrder(orders[0].id);
  }
}

function viewOrder(id) {
  document.querySelectorAll('.ord-item').forEach(el => el.classList.remove('active'));
  const activeItem = document.getElementById(`ord_item_${id}`);
  if (activeItem) activeItem.classList.add('active');

  const order = orders.find(o => o.id === id);
  if(!order) return;

  const detailsHtml = generateDetailsHtml(order);

  if(window.innerWidth >= 992) {
    document.getElementById('desktopDetails').innerHTML = detailsHtml;
  } else {
    document.getElementById('mobileDetails').innerHTML = detailsHtml;
    document.getElementById('mobileModal').classList.add('active');
  }
}

function generateDetailsHtml(o) {
  const statuses = ['pending', 'confirmed', 'processing', 'shipped', 'delivered'];
  let currentIdx = statuses.indexOf(o.order_status);
  if(currentIdx === -1 && o.order_status !== 'cancelled') currentIdx = 0;

  // Uses global pmtNames map

  let itemsHtml = o.order_items.map(item => `
    <div class="prod-item">
      <div class="prod-item-img"><img src="${item.image_url || 'https://placehold.co/100x100?text=No+Image'}" alt="${item.name}"></div>
      <div class="prod-item-info">
        <div class="prod-title">${item.name}</div>
        <div class="prod-meta">Qty: ${item.quantity}</div>
      </div>
      <div class="prod-price">৳${(Number(item.price) * item.quantity).toLocaleString()}</div>
    </div>
  `).join('');

  let statusClass = 'status-pending';
  if (o.order_status === 'confirmed') statusClass = 'status-confirmed';
  if (o.order_status === 'processing') statusClass = 'status-processing';
  if (o.order_status === 'shipped') statusClass = 'status-shipped';
  if (o.order_status === 'delivered') statusClass = 'status-delivered';
  if (o.order_status === 'cancelled') statusClass = 'status-cancelled';

  return `
    <div class="ord-det-head">
      <div>
        <div class="ord-det-id">${o.order_number}</div>
        <div class="ord-det-date">Placed on ${new Date(o.created_at).toLocaleString()}</div>
      </div>
      <div class="ord-status ${statusClass}" style="font-size:12px; text-transform: capitalize;">${o.order_status}</div>
    </div>

    ${o.order_status !== 'cancelled' ? `
    <div class="timeline">
      <div class="tl-item ${currentIdx >= 0 ? 'done' : ''} ${currentIdx === 0 ? 'active' : ''}">
        <div class="tl-dot"></div>
        <div class="tl-title">Pending</div>
        <div class="tl-desc">We have received your order.</div>
      </div>
      <div class="tl-item ${currentIdx >= 1 ? 'done' : ''} ${currentIdx === 1 ? 'active' : ''}">
        <div class="tl-dot"></div>
        <div class="tl-title">Confirmed</div>
        <div class="tl-desc">Order has been verified.</div>
      </div>
      <div class="tl-item ${currentIdx >= 2 ? 'done' : ''} ${currentIdx === 2 ? 'active' : ''}">
        <div class="tl-dot"></div>
        <div class="tl-title">Processing</div>
        <div class="tl-desc">Preparing package for shipment.</div>
      </div>
      <div class="tl-item ${currentIdx >= 3 ? 'done' : ''} ${currentIdx === 3 ? 'active' : ''}">
        <div class="tl-dot"></div>
        <div class="tl-title">Shipped</div>
        <div class="tl-desc">Handed over to delivery partner.</div>
      </div>
      <div class="tl-item ${currentIdx >= 4 ? 'done' : ''} ${currentIdx === 4 ? 'active' : ''}">
        <div class="tl-dot"></div>
        <div class="tl-title">Delivered</div>
        <div class="tl-desc">Package delivered successfully.</div>
      </div>
    </div>
    ` : `
    <div style="padding:20px; background:#fee2e2; color:#dc2626; border-radius:8px; margin-bottom:30px; font-size:14px; font-weight:600;">
      <i class="fa-solid fa-circle-xmark"></i> This order was cancelled.
    </div>
    `}

    <div class="info-title">Items Ordered</div>
    <div class="prod-list">${itemsHtml}</div>

    <div class="info-block">
      <div class="info-title">Payment & Summary</div>
      <div class="info-row"><span>Method</span><span>${pmtNames[o.payment_method] || o.payment_method}</span></div>
      ${o.sender_number ? `<div class="info-row"><span>Sender Number</span><span>${o.sender_number}</span></div>` : ''}
      ${o.payment_trx_id ? `<div class="info-row"><span>TrxID</span><span>${o.payment_trx_id}</span></div>` : ''}
      <div class="info-row"><span>Subtotal</span><span>৳${Number(o.subtotal).toLocaleString()}</span></div>
      <div class="info-row"><span>Shipping</span><span>৳${Number(o.shipping_fee).toLocaleString()}</span></div>
      ${o.discount > 0 ? `<div class="info-row"><span>Discount</span><span style="color:#10b981;">-৳${Number(o.discount).toLocaleString()}</span></div>` : ''}
      <div class="info-row" style="border-top:1px solid #d1d5db; padding-top:8px; margin-top:8px;">
        <span>Total</span><span style="color:var(--primary); font-size:16px; font-weight:800;">৳${Number(o.total).toLocaleString()}</span>
      </div>
    </div>

    <div class="info-block">
      <div class="info-title">Shipping Details</div>
      <div class="info-row"><span>Name</span><span>${o.shipping_name}</span></div>
      <div class="info-row"><span>Phone</span><span>${o.shipping_phone}</span></div>
      <div class="info-row"><span>Address</span><span style="max-width:200px;">${o.shipping_address}, ${o.shipping_district}</span></div>
    </div>
  `;
}

function closeModal() {
  document.getElementById('mobileModal').classList.remove('active');
}
</script>
