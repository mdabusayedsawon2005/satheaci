<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){try{if(localStorage.getItem('sathe_achi_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.removeAttribute('data-theme');}}catch(e){}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Sathe Achi</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="sa-style.css?v=31">
  <style>
    body { background: var(--bg-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .sa-auth-card { background: var(--white); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 420px; box-shadow: var(--shadow-md); border: 1px solid var(--border); }
    .sa-auth-logo { text-align: center; margin-bottom: 30px; }
    .sa-auth-logo a { display: inline-flex; align-items: center; gap: 8px; font-size: 28px; font-weight: 800; color: var(--text-dark); }
    .sa-auth-logo i { background: var(--primary); color: #fff; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); font-size: 20px; }
    .sa-auth-logo span { color: var(--primary); }
    .sa-auth-logo p { color: var(--text-muted); font-size: 14px; margin-top: 10px; }
    
    .sa-auth-form { display: flex; flex-direction: column; gap: 15px; }
    .sa-input-wrap { position: relative; }
    .sa-input-wrap label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
    .sa-input-wrap input { width: 100%; padding: 12px 15px 12px 40px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 14px; outline: none; transition: var(--trans); }
    .sa-input-wrap input:focus { border-color: var(--primary); }
    .sa-input-wrap i.sa-icon-l { position: absolute; left: 15px; bottom: 14px; color: var(--text-muted); font-size: 14px; }
    
    .sa-auth-btn { width: 100%; padding: 14px; font-size: 16px; margin-top: 10px; }
    .sa-auth-footer { text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted); font-weight: 500; }
    .sa-auth-footer a { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body class="sa-has-back-btn">

<button class="sa-back-btn" onclick="navigateBack()" aria-label="Go back">
  <i class="fa-solid fa-chevron-left"></i>
</button>

<div class="sa-toasts" id="toastContainer"></div>

<div class="sa-auth-card">
  <div class="sa-auth-logo">
    <a href="index.html"><i class="fa-solid fa-bag-shopping"></i> Sathe<span>Achi</span></a>
    <p>Recover your account password</p>
  </div>
  <form id="forgotForm" class="sa-auth-form">
    <div class="sa-input-wrap">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="example@gmail.com">
      <i class="fa-regular fa-envelope sa-icon-l"></i>
    </div>
    <button type="submit" class="sa-btn-primary sa-auth-btn">Send Recovery Link</button>
  </form>
  <div class="sa-auth-footer">Remember your password? <a href="login.html">Log In</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js?v=31"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const oldText = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
    btn.disabled = true;

    const email = document.getElementById('email').value.trim();

    // Validate email structure
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      showToast('Please enter a valid email address.', 'error');
      btn.innerHTML = oldText;
      btn.disabled = false;
      return;
    }

    try {
      if (!supabaseClient) throw new Error('Supabase client is not loaded. Please try again.');

      const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password.html'
      });
      if (error) throw error;

      showToast('Password recovery instructions sent to your email!', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 2500);
    } catch (err) {
      showToast(err.message, 'error');
      btn.innerHTML = oldText;
      btn.disabled = false;
    }
  });
</script>
<script src="sa-motion.js?v=4"></script>
</body>
</html>
