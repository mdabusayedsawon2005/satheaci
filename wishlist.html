  <style>
    /* ─── PAGE TITLE BAR ─── */
    .pg-title-bar { background: var(--navy); padding: 16px 0; }
    .pg-title-bar h1 { color: #fff; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .pg-title-bar h1 i { color: var(--primary); }
    .pg-title-bar span { font-size: 13px; color: rgba(255,255,255,0.6); font-weight: 500; margin-left: auto; }

    /* ─── WISHLIST GRID ─── */
    .wish-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

    /* ─── WISHLIST CARD ─── */
    .wish-card { background: var(--white); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease; }
    .wish-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .wish-card:active { transform: scale(0.97) translateY(-1px); }
    .wish-card-remove { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; background: var(--white); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.12); cursor: pointer; transition: var(--trans); }
    .wish-card-remove:hover { color: var(--danger); background: #fef2f2; }
    .wish-card-remove:active { transform: scale(0.85); }
    .wish-card-img { height: 150px; display: flex; align-items: center; justify-content: center; background: #f7f8fa; padding: 15px; cursor: pointer; border-radius: var(--radius-md) var(--radius-md) 0 0; }
    .wish-card-img img { max-height: 100%; max-width: 100%; object-fit: contain; }
    .wish-card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .wish-card-cat { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    .wish-card-title { font-size: 13px; font-weight: 600; color: var(--text-dark); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
    .wish-card-stars { color: var(--warning); font-size: 10px; display: flex; align-items: center; gap: 3px; }
    .wish-card-stars span { color: var(--text-muted); font-size: 10px; }
    .wish-card-price { display: flex; align-items: center; gap: 6px; margin-top: auto; }
    .wish-card-price .now { font-size: 15px; font-weight: 800; color: var(--primary); }
    .wish-card-price .was { font-size: 11px; color: var(--text-muted); text-decoration: line-through; }
    .wish-card-atc { margin: 0 12px 12px; padding: 10px; background: var(--primary-light); color: var(--primary); font-weight: 700; font-size: 13px; border-radius: var(--radius-md); text-align: center; cursor: pointer; border: 1px solid rgba(255,107,0,0.2); transition: var(--trans); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .wish-card-atc:hover { background: var(--primary); color: #fff; }
    .wish-card-atc:active { transform: scale(0.95); }

    /* ─── DARK MODE OVERRIDES ─── */
    [data-theme="dark"] body { background: #0f172a; }
    [data-theme="dark"] .wish-card { background: rgba(30, 41, 59, 0.45); border-color: rgba(255, 255, 255, 0.05); }
    [data-theme="dark"] .wish-card-remove { background: #1e293b; color: #94a3b8; }
    [data-theme="dark"] .wish-card-remove:hover { background: #dc2626; color: #fff; }
    [data-theme="dark"] .wish-card-img { background: rgba(0,0,0,0.15); }
    [data-theme="dark"] .wish-card-title { color: #fff; }
    [data-theme="dark"] .wish-card-price .now { color: var(--primary); }
    [data-theme="dark"] .wish-card-price .was { color: #94a3b8; }
    [data-theme="dark"] .wish-card-atc { background: rgba(255, 107, 0, 0.1); border-color: rgba(255, 107, 0, 0.2); }
    [data-theme="dark"] .wish-card-atc:hover { background: var(--primary); color: #fff; }

    /* ─── EMPTY STATE ─── */
    .wish-empty { text-align: center; padding: 80px 30px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .wish-empty-icon { width: 100px; height: 100px; background: var(--primary-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 46px; color: var(--primary); }
    .wish-empty h2 { font-size: 20px; font-weight: 800; color: var(--text-dark); }
    .wish-empty p { font-size: 14px; color: var(--text-muted); max-width: 260px; }
    .wish-empty a { padding: 12px 28px; }

    @media (min-width: 769px) {
      .wish-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>

<script>
function starsHtml(r){
  var f=Math.floor(r),h=r%1>=.5?1:0,s='';
  for(var i=0;i<f;i++) s+='<i class="fa-solid fa-star"></i>';
  if(h) s+='<i class="fa-solid fa-star-half-stroke"></i>';
  return s;
}

async function loadAndRenderWishlist() {
  var wishlistIds = [];
  var countEl = document.getElementById('wishCount');
  var emptyEl = document.getElementById('wishEmpty');
  var gridEl = document.getElementById('wishGrid');

  // 1. Fetch from Supabase if logged in
  var session = null;
  if (window.supabaseClient) {
    try {
      var sessionRes = await window.supabaseClient.auth.getSession();
      session = sessionRes.data.session;
    } catch(e) {
      console.error("Session check failed:", e);
    }
  }

  if (session && session.user) {
    try {
      var { data: dbWishlist, error } = await window.supabaseClient
        .from('wishlist_items')
        .select('product_id')
        .eq('user_id', session.user.id);
      if (error) throw error;
      if (dbWishlist) {
        wishlistIds = dbWishlist.map(function(w) { return w.product_id.toString(); });
        // Sync script.js global array if present
        if (typeof wishlist !== 'undefined') {
          wishlist = wishlistIds.slice();
        }
      }
    } catch(err) {
      console.error("Failed to load wishlist from DB, using localStorage:", err);
      wishlistIds = getLocalWishlistIds();
    }
  } else {
    wishlistIds = getLocalWishlistIds();
  }

  if (!PRODUCTS || !PRODUCTS.length) {
    // If PRODUCTS aren't loaded yet, try again on storeDataLoaded
    return;
  }

  // Filter products by wishlist IDs
  var wlProducts = PRODUCTS.filter(function(p) {
    return wishlistIds.indexOf(p.id.toString()) > -1;
  });

  if (!wlProducts.length) {
    countEl.textContent = '0 Items';
    emptyEl.style.display = 'flex';
    gridEl.innerHTML = '';
    return;
  }

  emptyEl.style.display = 'none';
  countEl.textContent = wlProducts.length + ' Item' + (wlProducts.length > 1 ? 's' : '');

  var html = '';
  wlProducts.forEach(function(p) {
    var disc = p.originalPrice > p.discountPrice ? Math.round((p.originalPrice - p.discountPrice) / p.originalPrice * 100) : 0;
    html += '<div class="wish-card" id="wc_'+p.id+'">'
      + '<button class="wish-card-remove" onclick="removeWish(\''+p.id+'\')" title="Remove"><i class="fa-solid fa-xmark"></i></button>'
      + '<div class="wish-card-img" onclick="location.href=\'product.html?id='+p.id+'\'"><img src="'+p.image+'" alt="'+p.title+'" loading="lazy"></div>'
      + '<div class="wish-card-body">'
      + '<div class="wish-card-cat">'+p.category+'</div>'
      + '<div class="wish-card-title" onclick="location.href=\'product.html?id='+p.id+'\'">'+p.title+'</div>'
      + '<div class="wish-card-stars">'+starsHtml(p.rating)+'<span>('+p.reviewsCount+')</span></div>'
      + '<div class="wish-card-price"><span class="now">৳'+p.discountPrice.toLocaleString()+'</span>'
      + (p.originalPrice > p.discountPrice ? '<span class="was">৳'+p.originalPrice.toLocaleString()+'</span>' : '') + '</div>'
      + '</div>'
      + '<button class="wish-card-atc" onclick="addToCartFromWish(\''+p.id+'\')">'
      + '<i class="fa-solid fa-cart-shopping"></i> Add to Cart'
      + '</button>'
      + '</div>';
  });
  gridEl.innerHTML = html;
}

function getLocalWishlistIds() {
  try {
    var localData = localStorage.getItem('sathe_achi_wishlist');
    if (!localData) return [];
    var parsed = JSON.parse(localData);
    if (!Array.isArray(parsed)) return [];
    return parsed.map(function(item) {
      if (typeof item === 'object' && item !== null) {
        return item.id ? item.id.toString() : '';
      }
      return item ? item.toString() : '';
    }).filter(function(id) {
      return id !== '';
    });
  } catch (e) {
    console.error("Failed to parse local wishlist:", e);
    return [];
  }
}

window.removeWish = async function(id) {
  if (!id) return;
  id = id.toString();

  // Instant smooth fade-out animation
  var card = document.getElementById('wc_' + id);
  if (card) {
    card.style.transition = 'all 0.25s ease';
    card.style.opacity = '0';
    card.style.transform = 'scale(0.85)';
  }

  var session = null;
  if (window.supabaseClient) {
    try {
      var sessionRes = await window.supabaseClient.auth.getSession();
      session = sessionRes.data.session;
    } catch(e) {}
  }

  if (session && session.user) {
    try {
      var { error } = await window.supabaseClient
        .from('wishlist_items')
        .delete()
        .eq('user_id', session.user.id)
        .eq('product_id', id);
      if (error) console.warn("Wishlist item delete warning:", error);
    } catch (err) {
      console.error("Failed to delete wishlist item from DB:", err);
    }
  }

  var localIds = getLocalWishlistIds().filter(function(x) { return x !== id; });
  localStorage.setItem('sathe_achi_wishlist', JSON.stringify(localIds));

  if (typeof wishlist !== 'undefined') {
    wishlist = wishlist.filter(function(x) { return x.toString() !== id; });
  }

  showToast('পণ্যটি উইশলিস্ট থেকে সরানো হয়েছে', 'info');

  if (typeof updateBadges === 'function') {
    updateBadges();
  }

  setTimeout(function() {
    loadAndRenderWishlist();
  }, 250);
};

window.addToCartFromWish = function(id) {
  if (typeof addToCart === 'function') {
    addToCart(id.toString());
  } else {
    showToast('Failed to add to cart', 'error');
  }
};

document.addEventListener('storeDataLoaded', function() {
  loadAndRenderWishlist();
});
document.addEventListener('authChecked', function() {
  loadAndRenderWishlist();
});
window.addEventListener('DOMContentLoaded', function() {
  loadAndRenderWishlist();
});
</script>
